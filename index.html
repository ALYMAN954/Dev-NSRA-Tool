<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json?v=3">
<meta name="theme-color" content="#0E969C">
<link rel="icon" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NSRA">
<title>DEVICE NSRA Tool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap">
<style>
/* Layout: calm single-column flow; sticky header, fixed bottom dock; practice mode pairs a sticky case card with the questions on wide screens. Fully mirrored in Arabic (RTL). */
:root {
  --bg:#EDF4F5; --bg2:#E0EDF0; --surface:#FFFFFF; --ink:#173540; --muted:#587480; --line:#CFE0E5;
  --accent:#2F8A96; --accent-ink:#FFFFFF; --accent-soft:#DDF0F2; --lav:#7B77C4; --lav-soft:#EAE9F8;
  --low:#2E8B63; --low-bg:#E0F2E9; --mod:#8F6B0C; --mod-bg:#FAF0D2; --high:#B85C22; --high-bg:#FCE6D6; --ext:#B83C54; --ext-bg:#F9DCE2;
  --shadow:0 6px 24px rgba(23,53,64,.08);
  --f-display:'Fraunces', 'Noto Naskh Arabic', Georgia, 'Times New Roman', serif;
  --f-body:'Figtree', 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0E1A20; --bg2:#12222A; --surface:#172831; --ink:#E4EFF2; --muted:#93AEB8; --line:#27414C;
    --accent:#6CC3CD; --accent-ink:#08242A; --accent-soft:#1C3A42; --lav:#A9A6EC; --lav-soft:#26254A;
    --low:#6FD0A0; --low-bg:#17352A; --mod:#E5BE55; --mod-bg:#3A3015; --high:#F0A06A; --high-bg:#402B1B; --ext:#F2889C; --ext-bg:#43202A;
    --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0E1A20; --bg2:#12222A; --surface:#172831; --ink:#E4EFF2; --muted:#93AEB8; --line:#27414C;
  --accent:#6CC3CD; --accent-ink:#08242A; --accent-soft:#1C3A42; --lav:#A9A6EC; --lav-soft:#26254A;
  --low:#6FD0A0; --low-bg:#17352A; --mod:#E5BE55; --mod-bg:#3A3015; --high:#F0A06A; --high-bg:#402B1B; --ext:#F2889C; --ext-bg:#43202A;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme: dark;
}
:root[lang="ar"] {
  --f-display:'Noto Naskh Arabic', 'Fraunces', Georgia, serif;
  --f-body:'IBM Plex Sans Arabic', 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface); }
h1,h2,h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1060px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 0; min-width: 0; text-align: start; }
.brand-mark { width: 30px; height: 30px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--accent-soft), var(--accent)); box-shadow: inset 0 0 0 5px var(--surface), 0 0 0 1.5px var(--accent); }
.brand-name { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; white-space: nowrap; }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; text-align: center; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: .92rem; }

main { padding-block: 22px 120px; }
.view[hidden] { display: none !important; }

/* home */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: clamp(24px, 6vw, 56px); background: linear-gradient(135deg, var(--accent-soft), var(--lav-soft)); }
.hero::before, .hero::after { content:""; position:absolute; border-radius:50%; background: var(--surface); opacity:.35; pointer-events:none; }
.hero::before { width: 320px; height: 320px; inset-inline-end: -90px; top: -110px; }
.hero::after { width: 190px; height: 190px; inset-inline-end: 60px; bottom: -90px; opacity:.25; }
.hero > * { position: relative; z-index: 1; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; font-weight: 700; color: var(--muted); }
:root[lang="ar"] .eyebrow, :root[lang="ar"] .field label, :root[lang="ar"] .compare small, :root[lang="ar"] .note small, :root[lang="ar"] .case .tag, :root[lang="ar"] .case .meta small { letter-spacing: 0; text-transform: none; }
.hero h1 { font-size: clamp(1.9rem, 6.4vw, 3.3rem); margin-top: 10px; max-width: 18ch; }
:root[lang="ar"] .hero h1 { max-width: 22ch; line-height: 1.4; }
.hero h1 span { color: var(--accent); }
.lead { max-width: 52ch; margin-top: 14px; color: var(--muted); font-size: 1.05rem; }
.creator { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; padding: 8px 16px; padding-inline-start: 8px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
.creator i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; background: var(--lav); color: #fff; display: grid; place-items: center; font-size: .8rem; }
.creator small { display: block; font-weight: 500; color: var(--muted); font-size: .72rem; line-height: 1.1; }
.creator b { display: block; line-height: 1.2; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 20px; }
.choice { text-align: start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
.choice:hover { transform: translateY(-2px); border-color: var(--accent); }
.choice h2 { font-size: 1.3rem; }
.choice p { color: var(--muted); }
.choice .go { margin-top: 6px; font-weight: 700; color: var(--accent); }
.ladder-wrap { margin-top: 28px; }
.ladder-wrap h3 { font-size: 1.05rem; margin-bottom: 10px; }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ladder div { padding: 12px 10px; border-radius: 12px; font-size: .86rem; line-height: 1.3; }
.ladder b { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.ladder .l-low { background: var(--low-bg); color: var(--low); }
.ladder .l-mod { background: var(--mod-bg); color: var(--mod); }
.ladder .l-high { background: var(--high-bg); color: var(--high); }
.ladder .l-ext { background: var(--ext-bg); color: var(--ext); }
.foot { margin-top: 28px; text-align: center; color: var(--muted); font-size: .85rem; }
.sitefoot { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: .85rem; line-height: 1.6; }
.sitefoot b { color: var(--ink); }
.credit { margin-top: 16px; text-align: center; color: var(--muted); font-size: .8rem; }
.privacy { margin-top: 12px; color: var(--muted); font-size: .88rem; }
.sendstatus { margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-weight: 600; font-size: .92rem; }
.sendstatus.sent { border-color: var(--low); color: var(--low); }
.sendstatus.queued { border-color: var(--high); color: var(--high); }
.sendstatus.missing, .sendstatus.off, .sendstatus.sending { color: var(--muted); }

/* reminders */
.due-card { margin-top: 20px; }
.due-card h3 { font-size: 1.1rem; margin-bottom: 10px; }
.due-list { display: grid; gap: 8px; }
.due-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.due-row .mrn { font-weight: 700; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
.pill.low { background: var(--low-bg); color: var(--low); } .pill.mod { background: var(--mod-bg); color: var(--mod); }
.pill.high { background: var(--high-bg); color: var(--high); } .pill.ext { background: var(--ext-bg); color: var(--ext); }
.due-row .cd { margin-inline-start: auto; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.over { color: var(--ext) !important; font-weight: 700; }
.reassess { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.reassess b { font-family: var(--f-display); }
.reassess .cd { margin-inline-start: auto; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.install { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: space-between; }
.install p { color: var(--muted); font-size: .92rem; }

/* page heads */
.pagehead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.pagehead h2 { font-size: clamp(1.4rem, 4.5vw, 2rem); }
.pagehead p { color: var(--muted); margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.field label { display: block; font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.field input { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
.field input:focus { outline: 3px solid var(--lav); outline-offset: 1px; border-color: var(--lav); }

.crit-list { display: grid; gap: 16px; margin-top: 18px; }
fieldset.crit { margin: 0; border: 1px solid var(--line); border-radius: 20px; padding: 16px; background: var(--surface); min-width: 0; }
fieldset.crit legend { padding: 0 8px; font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; }
.opts { display: grid; gap: 8px; }
.opt { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; padding: 10px 12px; min-height: 52px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt .score { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface); border: 1.5px solid var(--line); font-variant-numeric: tabular-nums; }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .score { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt:has(input:focus-visible) { outline: 3px solid var(--lav); outline-offset: 2px; }
.opt.is-correct { border-color: var(--low); background: var(--low-bg); }
.opt.is-correct .score { background: var(--low); color: var(--surface); border-color: var(--low); }
.opt.is-wrong { border-color: var(--ext); background: var(--ext-bg); }
.opt.is-wrong .score { background: var(--ext); color: var(--surface); border-color: var(--ext); }
.locked .opt { cursor: default; }
.verdict { margin-top: 10px; font-size: .9rem; font-weight: 600; }
.verdict.ok { color: var(--low); } .verdict.no { color: var(--ext); }

/* result */
.result { margin-top: 22px; border-radius: 24px; padding: clamp(18px, 4vw, 30px); border: 2px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.result.pending { text-align: center; color: var(--muted); }
.result.c-low { border-color: var(--low); background: linear-gradient(var(--low-bg), var(--surface) 60%); }
.result.c-mod { border-color: var(--mod); background: linear-gradient(var(--mod-bg), var(--surface) 60%); }
.result.c-high { border-color: var(--high); background: linear-gradient(var(--high-bg), var(--surface) 60%); }
.result.c-ext { border-color: var(--ext); background: linear-gradient(var(--ext-bg), var(--surface) 60%); }
.score-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; }
.big { font-family: var(--f-display); font-size: clamp(3.4rem, 14vw, 5rem); line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.big small { font-size: .35em; color: var(--muted); font-family: var(--f-body); font-weight: 500; }
.cat { font-family: var(--f-display); font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 600; }
.c-low .cat, .c-low .big { color: var(--low); } .c-mod .cat, .c-mod .big { color: var(--mod); }
.c-high .cat, .c-high .big { color: var(--high); } .c-ext .cat, .c-ext .big { color: var(--ext); }
.rangeline { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.result h3 { font-size: 1.15rem; margin: 22px 0 10px; }
.guide { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.guide li { padding: 12px 14px; padding-inline-start: 40px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); position: relative; }
.guide li::before { content: ""; position: absolute; inset-inline-start: 15px; top: 19px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
:root[lang="ar"] .guide li::before { top: 22px; }
.breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 18px; }
.breakdown div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
.breakdown b { font-variant-numeric: tabular-nums; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
.compare div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.compare small { display: block; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; font-size: .7rem; }
.compare b { font-family: var(--f-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.note { margin-top: 22px; padding: 18px 20px; border-radius: 18px; background: var(--lav-soft); }
.note small { display: block; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; font-size: .72rem; color: var(--muted); margin-bottom: 6px; }
.note p { font-family: var(--f-display); font-size: 1.2rem; line-height: 1.5; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.copybox { width: 100%; margin-top: 12px; min-height: 120px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px; font: .85rem/1.4 ui-monospace, Menlo, monospace; direction: ltr; text-align: left; }

/* trend */
.trend { margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.trend h4 { margin: 0 0 8px; font-family: var(--f-display); font-size: 1.05rem; }
.trend .msg { font-weight: 600; }
.trend .msg.up { color: var(--ext); } .trend .msg.down { color: var(--low); } .trend .msg.same { color: var(--muted); }
.trend .sub { color: var(--muted); font-size: .88rem; margin-top: 2px; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 96px; margin-top: 12px; }
.bars .b { flex: 1 1 0; max-width: 56px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; min-width: 0; }
.bars .b i { display: block; width: 100%; border-radius: 6px 6px 2px 2px; min-height: 4px; }
.bars .b span { font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bars .b small { font-size: .66rem; color: var(--muted); white-space: nowrap; }
.bars .low i { background: var(--low); } .bars .mod i { background: var(--mod); } .bars .high i { background: var(--high); } .bars .ext i { background: var(--ext); }
.bars .b.now i { outline: 2px solid var(--ink); outline-offset: 1px; }

/* dashboard */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.tile small { display: block; color: var(--muted); font-weight: 700; font-size: .75rem; }
.tile b { font-family: var(--f-display); font-size: 2rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.panel { margin-top: 16px; }
.panel h3 { font-size: 1.1rem; margin-bottom: 12px; }
.stack { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: var(--bg); }
.stack i { display: block; min-width: 0; }
.stack .low, .legend .low i { background: var(--low); } .stack .mod, .legend .mod i { background: var(--mod); }
.stack .high, .legend .high i { background: var(--high); } .stack .ext, .legend .ext i { background: var(--ext); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; font-size: .88rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.hbar { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 44px; gap: 10px; align-items: center; margin-top: 8px; font-size: .9rem; }
.hbar .track { height: 12px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.hbar b { text-align: end; font-variant-numeric: tabular-nums; }
.days { display: flex; align-items: flex-end; gap: 3px; height: 110px; }
.days i { flex: 1 1 0; min-width: 0; background: var(--accent); border-radius: 3px 3px 1px 1px; min-height: 2px; opacity: .85; }
.days i.zero { background: var(--line); }
.axis { display: flex; justify-content: space-between; color: var(--muted); font-size: .75rem; margin-top: 6px; }
.dnote { text-align: center; color: var(--muted); padding: 24px 8px; }

/* practice */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
.chip { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: .92rem; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.practice-grid { display: grid; gap: 18px; margin-top: 18px; }
.case { background: var(--surface); border: 1.5px solid var(--accent); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); }
.case .tag { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.case h3 { font-size: 1.4rem; margin: 10px 0 12px; }
.case .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 14px; }
.case .meta div { background: var(--bg); border-radius: 12px; padding: 8px 12px; }
.case .meta small { display: block; color: var(--muted); font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
.case .meta b { font-variant-numeric: tabular-nums; }
.case p + p { margin-top: 10px; }
@media (min-width: 900px) {
  .practice-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
  .case-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 160px); overflow-y: auto; }
  .case-btn { display: none !important; }
  .practice-grid .crit-list { margin-top: 0; }
}

/* dock + sheet */

  var Q = jget('nsra-queue', []);

    return fetch(NSRA_ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) });
  }
  function setStatus(id, s) { if (R && R.sid === id) { R.status = s; paintStatus(); } }
  function flush() {
    if (flushing || !NSRA_ENDPOINT || !Q.length) return;
    flushing = true;
    (function next() {
      if (!Q.length) { flushing = false; return; }
      var p = Q[0];
      postOne(p).then(function () {
        Q = Q.filter(function (x) { return x.id !== p.id || x.v !== p.v; }); saveQ();
        if (!Q.some(function (x) { return x.id === p.id; })) setStatus(p.id, 'sent');

    })();

    var sig = JSON.stringify([n, e, m, R.a]);

    clearTimeout(R.timer);

  function trendHTML() {

    var items = R.trendItems.filter(function (x) { return x.id !== R.sid; }).sort(function (a, b) { return a.at - b.at; });

    for (var tries = 0; tries < 400; tries++) {
      var s = band[0] + Math.random() * (band[1] - band[0]), sc = {};
      CRITERIA.forEach(function (c) { var v = Math.round(1 + 3 * (s + (Math.random() - 0.5) * 0.6)); sc[c.id] = Math.max(1, Math.min(4, v)); });
      if (categoryOf(sumOf(sc).t).key === target) return sc;
    }
    var f = {}; CRITERIA.forEach(function (c) { f[c.id] = target === 'mod' ? 2 : target === 'high' ? 3 : 4; }); return f;
  }
  function genCase(diff) {
    var target = diff;
    if (diff === 'any') { var r = Math.random(); target = r < 0.12 ? 'low' : r < 0.42 ? 'mod' : r < 0.74 ? 'high' : 'ext'; }
    var sc = genScores(target), ga = GA_RANGE[sc.ga], bw = BW_RANGE[sc.ga];
    var w = rnd(ga[0], ga[1]), d = rnd(0, 6), dol = sc.ga === 4 ? rnd(1, 14) : sc.ga === 3 ? rnd(2, 28) : rnd(1, 30);
    var girl = Math.random() < 0.5, v = {};
    ['res', 'sen', 'act', 'moi', 'ski', 'blo', 'nut'].forEach(function (k) { v[k] = rnd(0, 1); });
    return { sc: sc, v: v, girl: girl, nm: pick(girl ? GIRLS : BOYS), mom: pick(MOMS), w: w, d: d, born: Math.max(22, w - Math.floor(dol / 7)), dol: dol, bw: rnd(Math.round(bw[0] / 10), Math.round(bw[1] / 10)) * 10, mrn: String(rnd(100000, 999999)) };
  }
  function tx(c, k) { return TEXT[k][c.sc[k]][c.v[k]][LI()]; }
  function caseHTML(c) {
    var name = lang === 'ar' ? (c.girl ? 'الطفلة ' : 'الطفل ') + c.nm[1] : 'Baby ' + c.nm[0];
    var ga = c.w + '+' + c.d + ' ' + t('weeks');
    var intro = lang === 'ar'
      ? 'وُلد الرضيع في الأسبوع ' + c.born + ' من الحمل، وعمره الحملي الحالي ' + ga + '، وهو الآن في اليوم ' + c.dol + ' من العمر في وحدة العناية المركزة لحديثي الولادة. '
      : name + ' was born at ' + c.born + ' weeks and is now ' + ga + ' current gestational age, on day ' + c.dol + ' of life in the NICU. ';
    var p1 = intro + [tx(c, 'res'), tx(c, 'sen'), tx(c, 'act')].join(' ');
    var p2 = [tx(c, 'ski'), tx(c, 'moi'), tx(c, 'blo'), tx(c, 'nut')].join(' ');
    return '<div class="case"><span class="tag">' + t('caseTag', P.n) + '</span><h3>' + name + '</h3>' +
      '<div class="meta"><div><small>' + t('sex') + '</small><b>' + (c.girl ? t('girl') : t('boy')) + '</b></div><div><small>' + t('curGa') + '</small><b>' + ga + '</b></div><div><small>' + t('dol') + '</small><b>' + c.dol + '</b></div><div><small>' + t('weight') + '</small><b>' + c.bw + ' ' + t('g') + '</b></div><div><small>' + t('motherL') + '</small><b>' + t('mrs') + ' ' + c.mom[LI()] + '</b></div><div><small>' + t('mrnL') + '</small><b>' + c.mrn + '</b></div></div>' +
      '<p>' + p1 + '</p><p>' + p2 + '</p></div>' +
      '<div class="actions"><button class="btn small" id="nextCaseTop">' + t('newCase') + '</button></div>';
  }
  function newCase() { P.n++; P.a = {}; P.done = false; P.last = null; P.c = genCase(P.diff); renderPractice(); window.scrollTo(0, 0); }
  function renderPractice() {
    if (!P.c) return;
    $('#caseCol').innerHTML = caseHTML(P.c);
    $('#nextCaseTop').addEventListener('click', newCase);
    buildCriteria($('#pracCrit'), 'p' + P.n, function (id, s) { P.a[id] = s; renderPracStatus(); }, P.a, P.done ? P.c.sc : null);
    renderPracStatus();
  }
  $$('#diffChips .chip').forEach(function (b) {
    b.addEventListener('click', function () {
      $$('#diffChips .chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      P.diff = b.dataset.d; newCase();
    });
  });
  function renderPracStatus() {
    var host = $('#pracResult'), s = sumOf(P.a);
    if (P.done) { renderPracResult(); }
    else {
      host.innerHTML = '<div class="actions"><button class="btn primary" id="checkBtn"' + (s.n < 8 ? ' disabled' : '') + '>' + t('check') + '</button></div>' +
        '<p class="rangeline" style="margin-top:8px">' + (s.n < 8 ? t('chooseAll', s.n) : t('ready')) + '</p>';
      var cb = $('#checkBtn'); if (cb) cb.addEventListener('click', submitPractice);
    }
    updateDock();
  }
  function submitPractice() {
    var right = 0;
    CRITERIA.forEach(function (c) { if (P.a[c.id] === P.c.sc[c.id]) right++; });
    P.done = true; P.right += right; P.cases++;
    P.good = right >= 7; P.msgI = rnd(0, 2); P.last = { right: right, mine: sumOf(P.a).t };
    renderPractice();
    var rc = $('#pracResult .result'); if (rc && rc.scrollIntoView) rc.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function renderPracResult() {
    var truth = sumOf(P.c.sc).t, cat = categoryOf(truth), mine = P.last.mine, mc = categoryOf(mine);
    var msg = (P.good ? MSG_GOOD : MSG_KEEP)[P.msgI][LI()];
    $('#pracResult').innerHTML =
      '<div class="result c-' + cat.key + '">' +
      '<div class="score-row"><div class="big">' + truth + '<small> / 32</small></div><div><div class="cat">' + catLabel(cat) + '</div><div class="rangeline">' + t('correctTotal', cat.range) + '</div></div></div>' +
      '<div class="compare"><div><small>' + t('critCorrect') + '</small><b>' + P.last.right + ' / 8</b></div><div><small>' + t('yourTotal') + '</small><b>' + mine + '</b></div><div><small>' + t('yourCat') + '</small><b style="font-size:1.1rem">' + catLabel(mc) + '</b></div></div>' +
      '<p class="rangeline" style="margin-top:12px">' + (mc.key === cat.key ? t('sameCat') : t('diffCat')) + '</p>' +
      '<h3>' + t('guideT') + '</h3>' + guideHTML(cat) +
      '<div class="note"><small>' + t('noteLabel') + '</small><p>' + msg + '</p></div>' +
      '<p class="rangeline" style="margin-top:14px">' + t('session', P.right, P.cases) + '</p>' +
      '<div class="actions"><button class="btn primary" id="nextCase">' + t('nextCase') + '</button><button class="btn" id="homeBtn2">' + t('home') + '</button></div><p class="credit">' + t('credit') + '</p></div>';
    $('#nextCase').addEventListener('click', newCase);
    $('#homeBtn2').addEventListener('click', function () { show('home'); });
  }

  /* ---------- dashboard ---------- */
  var D = null;
  function dnote(k) { $('#dashBody').innerHTML = '<div class="card dnote">' + t(k) + '</div>'; }
  function loadDash() {
    if (!NSRA_ENDPOINT) { dnote('dOff'); return; }
    if (!D) dnote('dLoad');
    fetchJson(NSRA_ENDPOINT + '?action=stats').then(function (j) {
      if (!j || !j.ok) throw new Error('bad'); D = j; renderDash();
    }).catch(function () { if (!D) dnote('dFail'); else renderDash(); });
  }
  function renderDash() {
    if (!D || !D.total) { dnote('dNone'); return; }
    var cats = ['low', 'mod', 'high', 'ext'], tot = D.total;
    var h = '<div class="tiles"><div class="tile"><small>' + t('dTotal') + '</small><b>' + D.total + '</b></div><div class="tile"><small>' + t('dAvg') + '</small><b>' + Number(D.avg).toFixed(1) + '</b></div><div class="tile"><small>' + t('dNurses') + '</small><b>' + D.nurses + '</b></div><div class="tile"><small>' + t('dMrns') + '</small><b>' + D.mrns + '</b></div></div>';
    h += '<div class="card panel"><h3>' + t('dRisk') + '</h3><div class="stack">' + cats.map(function (k) { return '<i class="' + k + '" style="width:' + (D.cats[k] / tot * 100) + '%" title="' + D.cats[k] + '"></i>'; }).join('') + '</div>' +
      '<div class="legend">' + cats.map(function (k) { return '<span class="' + k + '"><i></i>' + t(GUIDE[k].label) + ': <b>' + D.cats[k] + '</b> (' + Math.round(D.cats[k] / tot * 100) + '%)</span>'; }).join('') + '</div></div>';
    h += '<div class="card panel"><h3>' + t('dCrit') + '</h3>' + CRITERIA.map(function (c) {
      var v = D.crit[c.id] || 0;
      return '<div class="hbar"><span>' + c.short[LI()] + '</span><div class="track"><i style="width:' + Math.max(0, (v - 1) / 3 * 100) + '%"></i></div><b>' + Number(v).toFixed(1) + '</b></div>';
    }).join('') + '</div>';
    var mx = Math.max.apply(null, D.days.map(function (x) { return x.n; }).concat([1]));
    h += '<div class="card panel"><h3>' + t('dDays') + '</h3><div class="days">' + D.days.map(function (x) {
      return '<i class="' + (x.n ? '' : 'zero') + '" style="height:' + (x.n ? Math.max(6, x.n / mx * 100) : 2) + '%" title="' + x.d + ': ' + x.n + '"></i>';
    }).join('') + '</div><div class="axis"><span>' + D.days[0].d.slice(5) + '</span><span>' + D.days[D.days.length - 1].d.slice(5) + '</span></div></div>';
    $('#dashBody').innerHTML = h;
  }
  $('#dashRefresh').addEventListener('click', function () { D = null; loadDash(); });

  /* ---------- dock + case sheet ---------- */
  function updateDock() {
    var st = $('#dockStat'); if (!st) return;
    if (current === 'real') {
      var s = sumOf(R.a);
      st.innerHTML = t('dockSel', s.n) + '<small>' + (s.n ? t('dockRun', s.t) + (s.n === 8 ? ' · ' + catLabel(categoryOf(s.t)) : '') : t('dockChoose')) + '</small>';
    } else if (current === 'practice') {
      var p = sumOf(P.a);
      st.innerHTML = P.done ? t('dockChecked') + '<small>' + t('dockReview') + '</small>' : t('dockSel', p.n) + '<small>' + t('dockCase', P.n, p.t) + '</small>';
    }
  }
  function openSheet() { var c = $('#caseCol .case'); $('#sheetCase').innerHTML = c ? c.outerHTML : ''; $('#sheet').hidden = false; }
  function closeSheet() { $('#sheet').hidden = true; }
  $('#caseBtn').addEventListener('click', openSheet);
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheet').addEventListener('click', function (e) { if (e.target === $('#sheet')) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* ---------- install (GitHub version) ---------- */
  var deferred = null;
  function setupInstall() {
    if (!NSRA_PWA) return;
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    if (standalone) return;
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    $('#installCard').hidden = false;
    $('#instTxt').textContent = ios ? t('instIos') : t('instGen');
    $('#instBtn').hidden = !deferred;
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; setupInstall(); });
  $('#instBtn').addEventListener('click', function () { if (deferred) { deferred.prompt(); deferred = null; $('#installCard').hidden = true; } });
  window.addEventListener('appinstalled', function () { $('#installCard').hidden = true; });
  if (NSRA_PWA && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  /* ---------- language switch + boot ---------- */
  function rerender() {
    applyStatic();
    drawRealCrit(); renderReal();
    if (P.c) renderPractice();
    renderDue(); if (D && current === 'dash') renderDash();
    if (!$('#sheet').hidden) openSheet();
    setupInstall(); updateDock();
  }
  $('#langBtn').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar'; LS.set('nsra-lang', lang); rerender();
  });
  rerender();
  flush();
})();
</script>

</body>
